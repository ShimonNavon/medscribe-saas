apiVersion: v1
kind: Namespace
metadata:
  name: medscribe-saas
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: medscribe-saas
data:
  default.conf: |
    server {
      listen 80;
      server_name arch.handclinic.co.il;
      root /usr/share/nginx/html;
      index voice-agent.html;
      location / {
        try_files $uri /voice-agent.html =404;
      }
    }
    server {
      listen 80 default_server;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      add_header Clear-Site-Data '"cache"' always;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      location / {
        try_files $uri $uri/ /index.html;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: medscribe-saas
  labels:
    app: medscribe-saas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medscribe-saas
  template:
    metadata:
      labels:
        app: medscribe-saas
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.5-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              for f in /cm/*.gz; do
                [ -e "$f" ] && gunzip -c "$f" > "/usr/share/nginx/html/$(basename "$f" .gz)"
              done
              exec nginx -g 'daemon off;'
          ports:
            - containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: cm
              mountPath: /cm
            - name: html
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: cm
          configMap:
            name: site-gz
        - name: html
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: medscribe-saas
spec:
  type: NodePort
  selector:
    app: medscribe-saas
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30095
      protocol: TCP
